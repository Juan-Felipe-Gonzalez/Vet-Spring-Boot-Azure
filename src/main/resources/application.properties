spring.application.name=app
spring.datasource.url=jdbc:sqlserver://chileserver.database.windows.net:1433;database=chilesbd;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
server.port=${PORT:1433}

#show SQL in the console
spring.jpa.show-sql=true 

# SQL Server dialect for Hibernate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

spring.jpa.hibernate.ddl-auto=update